services:
  lingxi:
    build:
      context: .
      dockerfile: Dockerfile
    image: lingxi-agent:local
    ports:
      - "8080:8080"
      - "8091:8091"
    environment:
      LINGXI_USER_DEFAULT_PASSWORD: ${LINGXI_USER_DEFAULT_PASSWORD:-}
      LINGXI_SESSION_COOKIE_SECURE: ${LINGXI_SESSION_COOKIE_SECURE:-false}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  resource-demo:
    build:
      context: ./examples
      dockerfile: resource-demo/Dockerfile
    image: lingxi-resource-demo:local
    network_mode: "service:lingxi"
    depends_on:
      - lingxi
    environment:
      DEMO_ACCESS_TOKEN: ${DEMO_ACCESS_TOKEN:-lingxi-demo-token}
      DEMO_PUBLIC_BASE_URL: http://localhost:8091
      DEMO_DATA_PATH: /app/data/resource-demo
      DEMO_LOG_PATH: /app/logs
    volumes:
      - ./examples/resource-demo/data:/app/data
      - ./examples/resource-demo/logs:/app/logs
    restart: unless-stopped
